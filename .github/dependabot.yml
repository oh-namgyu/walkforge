version: 2

updates:
  # The workflow pins actions by major version; this keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # walkforge has no runtime dependencies. The only declared one is the
  # optional `llm` extra (anthropic), which is deliberately unpinned, so this
  # rarely has anything to do. It stays enabled so that changes are noticed.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    labels:
      - dependencies
