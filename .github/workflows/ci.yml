name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Standard-library only and platform independent, so one runner covers
        # it; the matrix exists to hold the 3.9 floor and the 3.12 ceiling.
        # The `anthropic` SDK is deliberately not installed: the LLM tests stub
        # the client, and the CLI must stay usable without the optional extra.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile
        run: python -m compileall -q walkforge

      - name: Test
        run: python -m pytest tests/ -q

      - name: Smoke the entry point
        run: walkforge --help
